plugins {
    id 'java' 
    id 'maven-publish'
}

group 'org.ic4j'
version '0.8.5'

sourceCompatibility = 1.8

repositories {
    mavenLocal()
    mavenCentral()
}

jar {
    manifest {
        attributes('Implementation-Title': 'ic4j-websocket',
                   'Implementation-Version': project.version)
    }
    
    archiveBaseName = 'ic4j-websocket'
}

task fatJar(type: Jar) {
    manifest {
        attributes('Implementation-Title': 'ic4j-websocket',
                   'Implementation-Version': project.version)
    }
    
    archiveBaseName = 'ic4j-websocket-with-dependencies'
    
    from { configurations.compileClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

test {
    useJUnitPlatform()
}

dependencies {
	implementation group: 'org.ic4j', name: 'ic4j-agent', version: '0.8.5'
	implementation group: 'org.ic4j', name: 'ic4j-candid', version: '0.8.5'

	implementation group: 'commons-codec', name: 'commons-codec', version: '1.23.0'
	
	// https://mvnrepository.com/artifact/javax.websocket/javax.websocket-client-api
	implementation group: 'javax.websocket', name: 'javax.websocket-client-api', version: '1.1'
	
	// https://mvnrepository.com/artifact/org.glassfish.tyrus.bundles/tyrus-standalone-client
	implementation group: 'org.glassfish.tyrus.bundles', name: 'tyrus-standalone-client', version: '1.20'
	
	implementation group: 'org.slf4j', name: 'slf4j-simple', version: '2.0.20'
	
	// https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
	implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.21.0'

	// https://mvnrepository.com/artifact/org.apache.httpcomponents.client5/httpclient5
	implementation group: 'org.apache.httpcomponents.client5', name: 'httpclient5', version: '5.6.5'
	
	// https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-databind
	implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.22.4'
	
	// https://mvnrepository.com/artifact/com.fasterxml.jackson.datatype/jackson-datatype-jdk8
	implementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jdk8', version: '2.22.4'
	
	// https://mvnrepository.com/artifact/com.fasterxml.jackson.dataformat/jackson-dataformat-cbor
	implementation group: 'com.fasterxml.jackson.dataformat', name: 'jackson-dataformat-cbor', version: '2.22.4'
	
	// https://mvnrepository.com/artifact/org.bouncycastle/bcprov-jdk18on
	implementation group: 'org.bouncycastle', name: 'bcprov-jdk18on', version: '1.86'

	// https://mvnrepository.com/artifact/org.bouncycastle/bcpkix-jdk18on
	implementation group: 'org.bouncycastle', name: 'bcpkix-jdk18on', version: '1.86'
	
	// https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-engine
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.14.4'
}




publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'ic4j-websocket'
        }
    }
}
